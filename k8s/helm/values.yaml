# Default values for warp.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Number of warp client instances
replicaCount: 4

image:
  repository: minio/warp
  pullPolicy: IfNotPresent
  # Set version to use a specific release of Warp
  # version: latest

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# S3 over RDMA. See https://github.com/minio/warp/blob/master/RDMA.md
#
# RDMA needs the RDMA build of warp, which every release publishes as its own
# image flavor rather than as part of the stock one. Enabling this switches both
# the server Job and the client StatefulSet onto that image, points warp at the
# fabric, and gives the containers the capability they need to pin buffers. It
# does not provision the fabric itself: see `hostNetwork`, `podAnnotations` and
# `resources` below for the three ways a cluster hands an RDMA device to a pod.
rdma:
  enabled: false

  # Transport buffer: "cpu" for host memory, "gpu" for GPU-Direct.
  #
  # "gpu" needs an NVIDIA GPU and a driver on every warp pod, the server
  # included: it probes the CUDA runtime while parsing flags and refuses to
  # start without one.
  mode: cpu

  # Stage PUTs through a pinned window of this size instead of pinning the whole
  # object, e.g. "64MiB". Objects then upload as multipart, so their ETag gains
  # a -N suffix. Empty pins the whole object.
  window: ""

  # Use only this RDMA device, e.g. "mlx5_1". Worth setting when the nodes have
  # cards on more than one fabric and only one of them reaches the storage
  # server. Empty uses every device with an ACTIVE port.
  device: ""

  image:
    # Where the RDMA images are published. This is a separate registry, not a
    # variant of image.repository: only quay.io/minio/aistor/warp carries .rdma
    # tags, while image.repository defaults to minio/warp, which does not.
    #
    # So mirroring means overriding both. Changing image.repository alone leaves
    # the RDMA pods pulling from quay.io, because a non-empty value here always
    # wins. Set this to "" to follow image.repository instead, for a mirror that
    # carries both flavors under one name.
    repository: quay.io/minio/aistor/warp
    # Defaults to "<image.version>.rdma". `latest` never resolves to an RDMA
    # image, so image.version has to name a release -- or this has to name the
    # tag outright.
    version: ""

  # How the pods reach the fabric. Pick whichever your cluster provides:
  #
  #  * RDMA shared device plugin: request "rdma/hca: 1" under `resources` below.
  #  * SR-IOV with Multus: name the network attachment in `podAnnotations`,
  #    e.g. k8s.v1.cni.cncf.io/networks: sriov-rdma
  #  * The node's own network: set `hostNetwork` true. It needs no plugin, but
  #    the pods then share the node's ports, so only one warp pod per node can
  #    bind service.port.
  hostNetwork: false
  podAnnotations: {}

  # Merged over clientResources and serverResources, so the fabric and GPU
  # requests are declared once for both roles:
  #   limits:
  #     rdma/hca: 1
  #     nvidia.com/gpu: 1
  # Extended resources need no matching `requests`; Kubernetes copies the limit.
  resources: {}

  # Registering memory with the NIC pins it, which the node's default memlock
  # limit caps at a few megabytes. Adds CAP_IPC_LOCK to the warp containers.
  # Turn off only on nodes configured with an unlimited memlock.
  ipcLock: true

# Option 1: Define warp configuration inline (legacy method - commented out by default)
# Uncomment and use this section if you prefer the legacy configuration method
# warpConfiguration:
#   # MinIO or other S3 Compatible server URL
#   s3ServerURL: minio-{0...3}.minio.default.svc.cluster.local:9000
#   # Whether TLS enabled or not for above URL
#   s3ServerTLSEnabled: false
#   # Region for S3 Server
#   s3ServerRegion: "us-east-1"
#   # MinIO or other S3 Compatible server Access Key
#   s3AccessKey: "minio"
#   # MinIO or other S3 Compatible server Secret Key
#   s3SecretKey: "minio123"
#   # Operation to be benchmarked (get / put / delete / list / stat / mixed)
#   operationToBenchmark: get

# warpJobArgs: {}
#   # Full args can be found: https://github.com/minio/warp#usage
#   #
#   # Number of objects to be used
#   # objects: 1000
#   #
#   # Object size to be used for benchmarks
#   # obj.size: 10MiB
#   #
#   # Duration for which the benchmark will run
#   # duration: 5m0s
#   #
#   # Number of parallel operations to run during benchmark
#   # concurrent: 10
#   #
#   # By default operations are performed on a bucket called warp-benchmark-bucket.
#   # This can be changed using the --bucket parameter. Do however note that the bucket
#   # will be completely cleaned before and after each run, so it should not contain any data.
#   # bucket: "warp-benchmark-bucket"

# Option 2: Provide complete YAML config file (default - recommended method)
# This takes precedence over warpConfiguration if both are defined
# The 'warp-client' property is automatically added based on replicaCount
# Example config based on https://github.com/minio/warp/tree/master/yml-samples
configFile: |
  warp:
    api: v1
    benchmark: get
    quiet: false
    no-color: false
    json: false
    # Note: warp-client is auto-generated, no need to specify it
    remote:
      region: us-east-1
      access-key: 'minioadmin'
      secret-key: 'minioadmin'
      host:
        - 'minio-0.minio.default.svc.cluster.local:9000'
        - 'minio-1.minio.default.svc.cluster.local:9000'
        - 'minio-2.minio.default.svc.cluster.local:9000'
        - 'minio-3.minio.default.svc.cluster.local:9000'
      tls: true
      insecure: true
    params:
      duration: 5m
      concurrent: 10
      objects: 1000
      obj:
        size: 10MiB

# Job restart behavior on helm upgrade
job:
  # If true, the job will be automatically restarted on helm upgrade
  restartOnUpgrade: true

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  # name:

securityContext:
  readOnlyRootFilesystem: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

service:
  port: 7761

serverResources: {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

clientResources: {}
  # limits:
  #   cpu: 4
  #   memory: 512Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
