name: Release (RDMA)

# The regular release artifacts are built with CGO_ENABLED=0 and therefore
# cannot do S3-over-RDMA: --rdma needs libminiocpp linked in. This workflow
# builds the additional, self-contained RDMA tarballs and attaches them to
# the release for the tag.

on:
  push:
    tags:
    - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload (e.g. v1.5.0)"
        required: true
        type: string

permissions:
  contents: write

# A tag push and a manual dispatch for the same tag would otherwise upload
# to the same release assets concurrently. Queue them instead of cancelling,
# so an upload in flight is never interrupted.
concurrency:
  group: release-rdma-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: warp-rdma (${{ matrix.config.arch }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - { os: ubuntu-latest,    arch: "amd64" }
        - { os: ubuntu-24.04-arm, arch: "arm64" }

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        ref: ${{ inputs.tag || github.ref }}
        fetch-depth: 0
        persist-credentials: false

    - name: Install system dependencies
      run: |
        sudo apt-get -qy update
        sudo apt-get -qy install libibverbs-dev librdmacm-dev libnuma-dev

    # Ubuntu's cmake is older than vcpkg needs, and vcpkg does not fetch its
    # own on arm64, so provision it explicitly on both architectures.
    - name: Set up CMake
      uses: lukka/get-cmake@v4.4.2

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: "go.mod"

    - name: Build RDMA release artifact
      env:
        VERSION: ${{ inputs.tag || github.ref_name }}
      run: |
        ./scripts/build-rdma.sh \
          --version "${VERSION}" \
          --out "${GITHUB_WORKSPACE}/dist-rdma"

    - name: Upload artifact to workflow run
      uses: actions/upload-artifact@v4
      with:
        name: warp-rdma-linux-${{ matrix.config.arch }}
        path: dist-rdma/

    - name: Attach artifact to release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ inputs.tag || github.ref_name }}
        REPO: ${{ github.repository }}
      run: |
        # The release for this tag is created by the main release pipeline,
        # which may still be running. Wait for it before uploading, and keep
        # retrying a failed upload rather than letting bash -e end the job.
        for i in $(seq 1 30); do
          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            if gh release upload "${TAG}" dist-rdma/* --clobber --repo "${REPO}"; then
              exit 0
            fi
            echo "upload failed, retrying in 60s ($i/30)" >&2
          else
            echo "release ${TAG} not published yet, retrying in 60s ($i/30)"
          fi
          sleep 60
        done
        echo "release ${TAG} never appeared; artifacts are attached to this workflow run" >&2
        exit 1
