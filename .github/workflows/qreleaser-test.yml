name: Q Release Test

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
      version_tag:
        description: "Version tag (e.g., v1.5.0)"
        required: true
        type: string

  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up CMake
        uses: lukka/get-cmake@v4.4.2

      # Go before the prefixes: the provisioning script link-tests each
      # architecture with a smoke build when a toolchain is available.
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: false

      # The release builds warp-rdma for linux/amd64 and linux/arm64, and both
      # link libminiocpp through cgo, so the runner needs the same prefixes as a
      # real release host. Without them the pipeline fails on miniocpp/c_api.h,
      # or on the missing aarch64 compiler.
      #
      # Running the release-host script rather than repeating its steps keeps CI
      # from drifting away from how the host is actually provisioned, and covers
      # the arm64 cross build on every PR. It keeps its checkouts outside the
      # workspace, which is what qreleaser releases from.
      - name: Provision the RDMA prefixes
        run: ./scripts/setup-rdma-release-host.sh

      - name: Configure git
        run: |
          git config --global user.name "MinIO Bot"
          git config --global user.email "dev@min.io"

      - name: Install Just
        uses: extractions/setup-just@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Q Release Toolkit
        run: |
          curl -fsSL https://dl.min.io/download-info/qreleaser.tar.zst -o /tmp/qreleaser.tar.zst
          tar --zstd -xf /tmp/qreleaser.tar.zst -C /tmp/
          echo y | just -f /tmp/qreleaser/Justfile install
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          qreleaser setup-deps --install

      - name: Determine release type and version
        id: release-type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TYPE="${{ inputs.release_type }}"
            echo "version=${{ inputs.version_tag }}" >> $GITHUB_OUTPUT
          else
            TYPE="stable"
            echo "version=v10.0.0" >> $GITHUB_OUTPUT
          fi
          echo "type=${TYPE}" >> $GITHUB_OUTPUT

          # Map type to directory name (used in artifact paths)
          if [ "$TYPE" = "stable" ]; then
            echo "type_dir=release" >> $GITHUB_OUTPUT
          else
            echo "type_dir=${TYPE}" >> $GITHUB_OUTPUT
          fi

      - name: Run Q Release (Test Mode)
        env:
          CI: "1"
          DEBUG: "1"
          Q_CI_SRC_DIR: ${{ github.workspace }}
          Q_VERSION_TAG: ${{ steps.release-type.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          qreleaser main ${{ github.repository }} ${{ steps.release-type.outputs.type }}

      - name: Verify Release Artifacts
        env:
          ARCH_DIR: ${{ github.workspace }}/warp-release/${{ steps.release-type.outputs.type_dir }}/linux-amd64
        run: |
          find ${{ github.workspace }}/warp-release -type f
          "${ARCH_DIR}/warp" --version
          # The RDMA flavor must land beside the stock binary rather than
          # replacing it, and must actually run.
          "${ARCH_DIR}/warp.rdma" --version
          # It is the RDMA build, so it accepts --rdma=cpu where the stock
          # binary refuses it. Both are named warp inside their dist directories,
          # so without this the flavor could silently be a copy of the stock
          # binary and nothing would notice.
          if "${ARCH_DIR}/warp" put --rdma=cpu --host 127.0.0.1:9000 >/tmp/stock.log 2>&1; then
            echo "stock warp unexpectedly accepted --rdma=cpu" >&2
            exit 1
          fi
          cat /tmp/stock.log
          grep -q "requires the RDMA build of warp" /tmp/stock.log

          # Require a specific outcome from the flavor, not merely the absence
          # of the refusal above: it has to get past the RDMA gate and fail at
          # the network instead, so a crash or an unrelated error cannot pass.
          "${ARCH_DIR}/warp.rdma" put --rdma=cpu --host 127.0.0.1:9000 >/tmp/rdma.log 2>&1 || true
          cat /tmp/rdma.log
          if grep -q "requires the RDMA build" /tmp/rdma.log; then
            echo "warp.rdma is not an RDMA build" >&2
            exit 1
          fi
          grep -q "Error preparing server" /tmp/rdma.log

          # The post-transform hook renames the packages after pkger builds
          # them, so their checksums are regenerated rather than carried over.
          # Walk the packages rather than the manifests, so a package that lost
          # its checksum fails here instead of passing unnoticed.
          found=0
          for pkg in "${ARCH_DIR}"/warp-rdma*.deb \
                     "${ARCH_DIR}"/warp-rdma*.rpm \
                     "${ARCH_DIR}"/warp-rdma*.apk; do
            [ -e "${pkg}" ] || continue
            found=1
            # sha256sum -c fails when the manifest is missing, so this also
            # requires every package to have one.
            (cd "${ARCH_DIR}" && sha256sum -c "$(basename "${pkg}").sha256sum")
          done
          [ "${found}" = 1 ] || { echo "no RDMA packages in ${ARCH_DIR}" >&2; exit 1; }

      - name: Verify arm64 RDMA Artifacts
        env:
          ARM_DIR: ${{ github.workspace }}/warp-release/${{ steps.release-type.outputs.type_dir }}/linux-arm64
        run: |
          # The arm64 flavor is cross-built and cannot run here, so assert the ELF
          # target instead. Both architectures are named warp inside their dist
          # directories, so without this the arm64 flavor could be an amd64 binary
          # and nothing would notice.
          readelf -h "${ARM_DIR}/warp.rdma" | grep -q AArch64

          found=0
          for pkg in "${ARM_DIR}"/warp-rdma*.deb \
                     "${ARM_DIR}"/warp-rdma*.rpm \
                     "${ARM_DIR}"/warp-rdma*.apk; do
            [ -e "${pkg}" ] || continue
            found=1
            (cd "${ARM_DIR}" && sha256sum -c "$(basename "${pkg}").sha256sum")
          done
          [ "${found}" = 1 ] || { echo "no arm64 RDMA packages in ${ARM_DIR}" >&2; exit 1; }

          # The bundled libs3rdma comes from a per-architecture prefix, so check
          # the payload too rather than trusting the package name.
          dpkg-deb -x "${ARM_DIR}"/warp-rdma*.deb /tmp/armdeb
          readelf -h /tmp/armdeb/usr/lib/warp/libs3rdma.so.0 | grep -q AArch64
          readelf -h /tmp/armdeb/usr/local/bin/warp | grep -q AArch64

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-artifacts-${{ steps.release-type.outputs.type }}
          path: warp-release/
          retention-days: 7
