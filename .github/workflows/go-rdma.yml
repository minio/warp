name: Build (RDMA)

on:
  pull_request:
    branches:
    - master
  push:
    branches:
    - master

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.config.tags }} (${{ matrix.config.arch }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - { os: ubuntu-latest,    arch: "amd64", tags: "rdma",      cuda: false }
        - { os: ubuntu-24.04-arm, arch: "arm64", tags: "rdma",      cuda: false }
        - { os: ubuntu-latest,    arch: "amd64", tags: "rdma,cuda", cuda: true }

    steps:
    - name: Checkout warp
      uses: actions/checkout@v5
      with:
        path: "warp"

    - name: Checkout minio-cpp
      uses: actions/checkout@v5
      with:
        repository: minio/minio-cpp
        path: "minio-cpp"

    - name: Checkout vcpkg
      uses: actions/checkout@v5
      with:
        repository: microsoft/vcpkg
        path: "vcpkg"

    - name: Install system dependencies
      run: |
        sudo apt-get -qy update
        sudo apt-get -qy install cmake libibverbs-dev librdmacm-dev libnuma-dev

    - name: Install CUDA runtime headers
      if: matrix.config.cuda
      run: |
        sudo apt-get -qy install nvidia-cuda-dev

    - name: Build and install libminiocpp.so with RDMA
      shell: bash
      run: |
        ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
        cd minio-cpp
        ../vcpkg/vcpkg install
        cmake . -B ./build \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=ON \
          -DCMAKE_INSTALL_PREFIX=/usr/local \
          -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake \
          -DMINIO_CPP_ENABLE_RDMA:BOOL=ON
        cmake --build ./build --config Release -j 4
        sudo cmake --install ./build
        cuobj_arch=$([ "${{ matrix.config.arch }}" = "amd64" ] && echo x86_64 || echo aarch64)
        sudo cp -P vendor/cuobj/lib/${cuobj_arch}/* /usr/local/lib/
        sudo ldconfig

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: "warp/go.mod"

    - name: Build and vet with -tags=${{ matrix.config.tags }}
      working-directory: warp
      env:
        CGO_ENABLED: "1"
      run: |
        go build -tags=${{ matrix.config.tags }} -o /tmp/warp .
        go vet -tags=${{ matrix.config.tags }} ./...
        /tmp/warp --version
